[package]
name = "rustpress"
version = "0.1.0"
edition = "2024"

[dependencies]
async-std = "1.13.2"
axum = { version = "0.8.8", features = [ "macros" ] }
http = "1.4.0"
serde = "1.0.228"
serde-aux = "4.7.0"
serde_json = "1.0.149"
sqlx = { version = "0.8.6", features = [ "runtime-tokio", "sqlite"] }
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread"] }
tower-http = { version = "0.6.8", features = ["cors"] }
